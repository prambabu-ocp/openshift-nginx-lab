{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>{{ .Values.pageTitle }}</title>
    </head>
    <body>
      <h1>{{ .Values.pageMessage }}</h1>
      <h2>Environment: {{ .Values.environment }}</h2>
      <p>Application: Nginx</p>
      <p>Deployed using Helm on OpenShift</p>
    </body>
    </html>
{{- end }}