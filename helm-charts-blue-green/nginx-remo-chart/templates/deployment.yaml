{{- $root := . }}
{{- range $color := list "blue" "green" }}
{{- $slot := index $root.Values $color }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $color }}
  labels:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    deployment-color: {{ $color }}
spec:
  replicas: {{ $root.Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      deployment-color: {{ $color }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        deployment-color: {{ $color }}
    spec:
      containers:
        - name: nginx
          image: "{{ $root.Values.image.repository }}:{{ $slot.imageTag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: nginx-html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: nginx-html
          configMap:
            name: {{ $root.Release.Name }}-{{ $color }}
{{- end }}