apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-canary-stable
  labels:
    app: nginx-canary
    track: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-canary
      track: stable
  template:
    metadata:
      labels:
        app: nginx-canary
        track: stable
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: nginx-canary-stable-html