apiVersion: v1
kind: Service
metadata:
  name: nginx-canary-stable
spec:
  selector:
    app: nginx-canary
    track: stable
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-canary-canary
spec:
  selector:
    app: nginx-canary
    track: canary
  ports:
    - name: http
      port: 80
      targetPort: 8080