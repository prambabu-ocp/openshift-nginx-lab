apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: storage-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/prambabu-ocp/openshift-nginx-lab.git

    targetRevision: main

    path: storage

    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: storage-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true