apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storage-ingress
  namespace: storage-demo
spec:
  ingressClassName: nginx
  rules:
    - host: storage.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storage-demo
                port:
                  number: 8080


